services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      # Только для самого этого компьютера. Снаружи админка открывается через
      # Caddy по HTTPS; раньше порт был открыт во всю локальную сеть по HTTP.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Перезаписываем настройки для работы внутри докера
      - DB_HOST=db
      - DB_PORT=5432
      # Ollama, если она стоит на "хосте" (вашем ПК), доступна по этому адресу:
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      # Логи в именованном томе: переживают пересборку контейнера. Именно том,
      # а не папка ./logs: бот работает не от root, и в папку, созданную Docker
      # от root, писать бы не смог. Скачать лог за любой день — в админке, «Логи».
      - bot_logs:/app/logs

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      # Тоже только для этого компьютера: базу из сети никто открывать не должен
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # HTTPS для админки: получает и продлевает сертификат, передаёт запросы боту.
  # Настройки — в Caddyfile. Порты на хост не публикуются: снаружи к Caddy
  # приходит только туннель frpc.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      - PUBLIC_IP=${PUBLIC_IP:?Укажите в .env PUBLIC_IP — публичный IP, по которому открывается админка}
      - TLS_MODE=${TLS_MODE:-acme}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и учётная запись Let's Encrypt. Том обязателен: без него
      # сертификат запрашивался бы заново при каждом пересоздании контейнера
      # и быстро упёрся бы в лимиты Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

  frpc:
    image: snowdreamtech/frpc:latest
    restart: unless-stopped
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml
    depends_on:
      - caddy

volumes:
  postgres_data:
  bot_logs:
  caddy_data:
  caddy_config:
