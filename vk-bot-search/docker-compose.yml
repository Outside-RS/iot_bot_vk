services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Перезаписываем настройки для работы внутри докера
      - DB_HOST=db
      - DB_PORT=5432
      # Ollama, если она стоит на "хосте" (вашем ПК), доступна по этому адресу:
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      # Логи в именованном томе: переживают пересборку контейнера. Именно том,
      # а не папка ./logs: бот работает не от root, и в папку, созданную Docker
      # от root, писать бы не смог. Скачать лог за любой день — в админке, «Логи».
      - bot_logs:/app/logs

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frpc:
    image: snowdreamtech/frpc:latest
    restart: unless-stopped
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml
    depends_on:
      - bot

volumes:
  postgres_data:
  bot_logs:
